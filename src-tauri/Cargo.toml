[package]
name = "rag-pet"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
base64 = "0.22"
image = "0.24"
tokio = { version = "1", features = ["time", "rt"] }

[[bin]]
name = "rag-pet"
path = "src/main.rs"
